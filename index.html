<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SECURITY SCAN // 环境探测</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:#040806;color:#2bff9e;
    font:14px/1.75 "SF Mono",Consolas,"Courier New",monospace;
    padding:28px 22px;overflow-x:hidden;
  }
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,255,150,.035) 0 1px,transparent 1px 3px);
  }
  #term{max-width:900px;margin:0 auto;white-space:pre-wrap;word-break:break-all}
  .line{opacity:0;transform:translateY(2px);animation:show .18s forwards}
  @keyframes show{to{opacity:1;transform:none}}
  .k{color:#00e5ff}
  .ok{color:#2bff9e}
  .dim{color:#1a7a52}
  .warn{color:#ffd166}
  .head{color:#00e5ff;letter-spacing:2px}
  .big{font-size:19px;letter-spacing:3px;color:#00e5ff;margin:14px 0 6px}
  .cursor{display:inline-block;width:9px;height:15px;background:#2bff9e;
          animation:blink 1s steps(1) infinite;vertical-align:-2px}
  @keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<div id="term"></div>
<script>
(function(){
  const term = document.getElementById('term');
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  function add(html, cls){
    const d = document.createElement('div');
    d.className = 'line ' + (cls || '');
    d.innerHTML = html;
    term.appendChild(d);
    window.scrollTo(0, document.body.scrollHeight);
  }

  function esc(s){
    return String(s).replace(/[&<>"]/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  function hash(str){
    let h = 2166136261;
    for (let i = 0; i < str.length; i++){
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return (h >>> 0).toString(16).toUpperCase().padStart(8, '0');
  }

  function gpu(){
    try{
      const c = document.createElement('canvas');
      const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
      if(!gl) return '不可用';
      const ext = gl.getExtension('WEBGL_debug_renderer_info');
      return ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
    }catch(e){ return '不可用'; }
  }

  async function run(){
    const collected = [];

    add('SECURITY SCAN v3.1 — 浏览器环境探测', 'head');
    add('目标: 当前访问者 &nbsp;|&nbsp; 模式: 只读 &nbsp;|&nbsp; 时间: '
        + new Date().toLocaleString(), 'dim');
    add('────────────────────────────────────────────', 'dim');
    await sleep(320);

    add('[ OK ] 建立会话…… 完成', 'ok');
    await sleep(200);
    add('[ OK ] 读取公开环境参数……', 'ok');
    await sleep(200);

    const rows = [
      ['用户代理', navigator.userAgent],
      ['平台', navigator.platform || '未知'],
      ['语言', (navigator.languages && navigator.languages.length)
                ? navigator.languages.join(', ') : navigator.language],
      ['CPU 逻辑核心', navigator.hardwareConcurrency || '未知'],
      ['设备内存', navigator.deviceMemory ? navigator.deviceMemory + ' GB' : '未公开'],
      ['屏幕分辨率', screen.width + ' × ' + screen.height
                     + ' @' + (window.devicePixelRatio || 1) + 'x'],
      ['窗口尺寸', window.innerWidth + ' × ' + window.innerHeight],
      ['色深', screen.colorDepth + ' bit'],
      ['时区', Intl.DateTimeFormat().resolvedOptions().timeZone],
      ['触屏设备', navigator.maxTouchPoints > 0
                    ? '是 (' + navigator.maxTouchPoints + ' 点)' : '否'],
      ['网络类型', navigator.connection ? navigator.connection.effectiveType : '未公开'],
      ['GPU 渲染器', gpu()],
      ['Cookie 可用', navigator.cookieEnabled ? '是' : '否'],
      ['Do Not Track', navigator.doNotTrack || '未设置']
    ];

    for (const [k, v] of rows){
      collected.push(k + '=' + v);
      add('&nbsp;&nbsp;<span class="k">' + esc(k) + '</span> &nbsp;' + esc(v));
      await sleep(90);
    }

    add('────────────────────────────────────────────', 'dim');
    await sleep(200);

    // 公网 IP（通过公开查询服务，仅演示）
    try {
      const r = await fetch('https://api.ipify.org?format=json', {cache:'no-store'});
      const j = await r.json();
      collected.push('IP=' + j.ip);
      add('[ .. ] 出口 IP &nbsp;' + esc(j.ip)
          + ' <span class="dim">（公开查询服务返回）</span>', 'warn');
    } catch(e) {
      add('[ !! ] 出口 IP 查询被拦截或不可用', 'dim');
    }
    await sleep(200);

    // 电量（Chrome / Edge 支持）
    if (navigator.getBattery){
      try{
        const b = await navigator.getBattery();
        add('[ .. ] 电量 &nbsp;' + Math.round(b.level * 100) + '% &nbsp;'
            + (b.charging ? '充电中' : '未充电'), 'warn');
      }catch(e){}
    }

    await sleep(300);
    add('────────────────────────────────────────────', 'dim');
    add('[ OK ] 共获取 <span class="k">' + collected.length + '</span> 项环境信息', 'ok');
    add('[ OK ] 指纹摘要 <span class="k">' + hash(collected.join('|')) + '</span>', 'ok');
    await sleep(400);

    add('', '');
    add('扫描完成。<span class="cursor"></span>', 'big');
    add('说明：以上内容全部由浏览器主动公开，任何网站都能读取，未访问任何私有数据。', 'dim');
  }

  run();
})();
</script>
</body>
</html>
